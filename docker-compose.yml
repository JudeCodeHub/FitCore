services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitcore
      POSTGRES_PASSWORD: fitcore
      POSTGRES_DB: fitcore
    ports:
      - "5432:5432"
    volumes:
      - fitcore_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  fitcore_postgres_data:
